<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="A measuring tape, notebook and sewing tools" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d6b52"/><stop offset="1" stop-color="#052b20"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e28f"/><stop offset=".5" stop-color="#d9ac3f"/><stop offset="1" stop-color="#a77a22"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2d27b" stop-opacity=".5"/><stop offset="1" stop-color="#f2d27b" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f5"/><stop offset="1" stop-color="#9aa8a2"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".09"/></pattern>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<rect width="1200" height="560" fill="url(#dots)"/>
<circle cx="600" cy="250" r="320" fill="url(#glow)"/>
<circle cx="1090" cy="86" r="70" fill="#f2d27b" opacity=".15"/>
<circle cx="86" cy="480" r="110" fill="#fff" opacity=".05"/>
